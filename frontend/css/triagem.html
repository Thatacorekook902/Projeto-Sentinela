<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triagem</title>
</head>
<body>
    
<div class="container">
    <h2> Triagem Hospitalar</h2>

   <input type="nome" placeholder="Nome">
   <select id="sintoma"></select>

    <option value="">Selecione</option>
    <option value="dor_leve">Dor leve</option>
    <option value="resfriado">Resfriado</option>
    <option value="coriza">Coriza</option>
    <option value="tosse">Tosse</option>
    <option value="febre">Febre</option>
    <option value="vomito">Vômito</option>
    <option value="diarreia">Diarreia</option>
    <option value="falta_ar_moderada">Falta de ar</option>
    <option value="falta_ar_grave">Falta de ar grave</option>
    <option value="infarto">Suspeita de infarto</option>
    <option value="avc">Suspeita d avc</option>
    <option value="convulsao">Convulsão</option>
    <option value="hemorragia">Hemorragia</option>

</select>

   <input 
   id="temp"
   type="number"
   placeholder="Temperatura"
/>
 
   <input 
   id="alergia"
   placeholder="Alergias"
/>

   <textarea 
   id="observacao"
   placeholder="observaçôes"
></textarea>

<div id="resultado"></div>

<button onclick="salvar()">
    Salvar Triagem
</button>

</div>

<script>
    function classificarRisco(sintoma, Temperatura){

        const vermelhos = [
            "infarto",
            "avc",
            "convulsao",
            "hemorragia",
            "falta_ar_grave",
        ];

        const amarelos =[
            "febre",
            "vomito",
            "diarreia",
            "falta_ar_moderada",
        ];
     
        if(temperatura >= 39) {
            return "vermelho";
        }
     
       if (amarelos.includes(sintoma)) {
          return "amarelo";
       }

       return "verde";
    }

       function salvar(){
         const nome =
         document.getElementById("nome").value;

         const sintoma = 
         document.getElementById("sintoma").value;

         const temperatura =
          Number(document.getElementById("temp").value);

        const alergia =
         document.getElementById("alergia").value;
         
        const observacao =
         document.getElementById("observacao").value;
         
        const risco =
          classificarRisco(sintoma, temperatura);

        fetch("http://localhost:3000/triagem", {

            method:"POST",

            headers:{
                "content-type":"application/json"
            },

            body: JSON.stringify({

                nome,
                sintoma,
                temperatura,
                alergia,
                observacao,
                risco
        
          })

       })
       
       .then(r => r.json())

       .then(data => {
       
        const resultado = 
          document.getElementById("resultado");

          resultado.className = risco;

          resultado.innerHTML =
            "Classificação: "
             risco.toUpperCase();

             alert("Triagem salva");

        });

       }

</script>


</body>
</html>
